name: Update README cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: '{"username":"garciamilord","show_icons":true,"theme":"dark","hide_border":true,"include_all_commits":true}'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: '{"username":"garciamilord","layout":"compact","langs_count":8,"theme":"dark","hide_border":true,"size_weight":0.5,"count_weight":0.5}'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate streak card
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            "https://streak-stats.demolab.com?user=garciamilord&theme=dark&hide_border=true" \
            --output profile/streak.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No card changes to commit."
          else
            git commit -m "Update GitHub README cards"
            git push
          fi
