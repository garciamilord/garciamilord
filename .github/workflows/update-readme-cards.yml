name: Update README cards

on:
  # Runs daily at 06:17 UTC
  schedule:
    - cron: "17 6 * * *"

  # Allows you to run it manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=dark&hide_border=true&include_all_commits=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=dark&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # The stats action does not currently support a streak card,
      # so download the streak SVG separately.
      - name: Generate streak card
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=dark&hide_border=true" \
            --output profile/streak.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile

          if git diff --cached --quiet; then
            echo "No card changes to commit."
          else
            git commit -m "Update GitHub README cards"
            git push
          fi
